name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Test, lint and build APK
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FamilyHub.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FamilyHub-apk
          path: android/FamilyHub.apk
      # Lint doesn't fail the build; read the report here instead.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  # On pushes to main, publish each build as its own release (v0.1.<run>) so
  # the newest one is always at /releases/latest and Obtainium can spot it.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: FamilyHub-apk
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Family Hub 0.1.${{ github.run_number }}
          make_latest: true
          files: FamilyHub.apk
          body: Sideload FamilyHub.apk on Android. Built from ${{ github.sha }}.

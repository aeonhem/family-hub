name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FamilyHub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyHub-apk
          path: android/FamilyHub.apk
      # On main, keep a "latest" release with the APK attached so it can be
      # downloaded straight from a phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Family Hub (latest)
          prerelease: true
          files: android/FamilyHub.apk
          body: Sideload FamilyHub.apk on Android. Built from ${{ github.sha }}.
